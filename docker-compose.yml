version: '3.8'

services:
  # Veritabanı
  db:
    image: postgres:15
    container_name: storehub-db-live
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend API
  api:
    build:
      context: ./StoreHub.API
      dockerfile: Dockerfile
    container_name: storehub-api-live
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
